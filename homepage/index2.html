    <h1>山城重庆</h1>
    <p>重庆，简称"渝"，别称山城、雾都，是中国中西部唯一的直辖市。它依山而建，临江而居，长江与嘉陵江在此交汇，造就了独特的8D立体城市景观。</p>

    <h2>城市特色</h2>
    <p>重庆是一座"你以为在一楼，其实在二十楼"的神奇城市。轻轨可以穿楼而过，洪崖洞的吊脚楼群夜晚灯火通明，像极了《千与千寻》中的画面。每到春秋两季，雾气弥漫整座城，"雾都"之名由此而来。</p>

    <h2>关于重庆</h2>
    <p>重庆拥有三千多年的历史，曾是三国时期的江州、南宋的重庆府，也是抗战时期的陪都。如今它是长江上游的经济中心，也是火锅、小面等美食的发源地，每一个来到这里的人都会被它的烟火气所打动。</p>
